# The pipeline's own gate: the definitions that decide ship-worthiness are
# themselves under a gate.
#
# Every pull request and every push runs `scripts/pipeline-guard.ts` over the
# workflow files, the package manifest and the code-owner list, so a definition
# rewritten to continue past a failure, to run an action a review never read,
# or to drop a gate from the chain turns this check red on the same commit.
# Branch protection requires `pipeline-guard` alongside `gate`, so softening
# the pipeline and landing the softened pipeline are the same blocked act.
name: pipeline-guard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: the pipeline guard reads the definitions as a reviewer would
        run: bun scripts/pipeline-guard.ts
