# The weekly mutation audit: the score the local mutation runs hold at 99 is
# re-proven on a clock rather than trusted to have held still.
#
# This workflow gates no merge — the merge gate is `gate` plus
# `pipeline-guard` — so a schedule lives here and nowhere else: a clock is an
# audit, never a merge decision. Each mutation run restores the tree through
# its own trap, and `check:tree` at the end refuses a run that left
# instrumentation behind.
name: mutation

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: install
        run: bun install --frozen-lockfile
      - name: mutation audit (every scope)
        run: bun run mutate
      - name: the tree the mutation runs left behind
        run: bun run check:tree
