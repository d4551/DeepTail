# The release carrier: desktop bundles for a version tag, and nothing else.
#
# A tag build first calls the merge gate for the tagged commit, so bundles are
# only ever produced from a tree every gate reported green on. Bundles land as
# workflow artifacts; publishing a release and signing binaries are human acts
# with human credentials, and this workflow asks for no write access at all.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundles:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: install
        run: bun install --frozen-lockfile
      - name: the system libraries the tauri carrier links
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: apps/deeptail/src-tauri
      - name: bundle the desktop carriers
        working-directory: apps/deeptail
        run: bun run tauri build
      - name: the bundles this carrier produced
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: bundles-${{ matrix.os }}
          path: apps/deeptail/src-tauri/target/release/bundle/
          if-no-files-found: error
